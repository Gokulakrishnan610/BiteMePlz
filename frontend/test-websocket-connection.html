<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 5px; }
        input { padding: 5px; margin: 5px; width: 200px; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    
    <div>
        <label>Shop ID: </label>
        <input type="text" id="shopId" value="04ba3254-2f0c-423c-98cc-19bebbdd143e" placeholder="Enter shop ID">
        <br>
        <label>Environment: </label>
        <select id="environment">
            <option value="dev">Development (localhost:8000)</option>
            <option value="prod">Production (rec-kiosk.onrender.com)</option>
        </select>
        <br><br>
        <button onclick="testConnection()">Test WebSocket Connection</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>
    
    <script>
        let ws = null;
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            logsDiv.appendChild(logDiv);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        function testConnection() {
            const shopId = document.getElementById('shopId').value.trim();
            const environment = document.getElementById('environment').value;
            
            if (!shopId) {
                log('❌ Please enter a shop ID', 'error');
                return;
            }
            
            // Close existing connection
            if (ws) {
                ws.close();
                ws = null;
            }
            
            const wsUrl = environment === 'prod' 
                ? `wss://rec-kiosk.onrender.com/ws/orders/?shop_id=${shopId}`
                : `ws://localhost:8000/ws/orders/?shop_id=${shopId}`;
            
            log(`🔗 Attempting to connect to: ${wsUrl}`, 'info');
            log(`🏪 Shop ID: ${shopId}`, 'info');
            log(`🌍 Environment: ${environment.toUpperCase()}`, 'info');
            
            try {
                ws = new WebSocket(wsUrl);
                
                // Connection timeout
                const timeout = setTimeout(() => {
                    if (ws.readyState === WebSocket.CONNECTING) {
                        log('⏰ Connection timeout after 10 seconds', 'error');
                        ws.close();
                    }
                }, 10000);
                
                ws.onopen = () => {
                    clearTimeout(timeout);
                    log('✅ WebSocket connected successfully!', 'success');
                    log(`🔧 Ready state: ${ws.readyState}`, 'info');
                    
                    // Send test message
                    const testMessage = {
                        type: 'test',
                        message: 'Connection test from browser',
                        shop_id: shopId,
                        timestamp: new Date().toISOString()
                    };
                    ws.send(JSON.stringify(testMessage));
                    log('📤 Sent test message', 'info');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        log(`📨 Received: ${JSON.stringify(data, null, 2)}`, 'success');
                        
                        if (data.type === 'connection_established') {
                            log('🎉 Connection established message received!', 'success');
                            if (data.shop_id === shopId) {
                                log('✅ Shop ID matches!', 'success');
                            } else {
                                log(`❌ Shop ID mismatch! Expected: ${shopId}, Got: ${data.shop_id}`, 'error');
                            }
                        }
                    } catch (error) {
                        log(`❌ Error parsing message: ${error}`, 'error');
                        log(`📄 Raw message: ${event.data}`, 'info');
                    }
                };
                
                ws.onerror = (error) => {
                    clearTimeout(timeout);
                    log('❌ WebSocket error occurred', 'error');
                    log(`📋 Error details: ${JSON.stringify(error, null, 2)}`, 'error');
                };
                
                ws.onclose = (event) => {
                    clearTimeout(timeout);
                    log(`🔌 WebSocket closed. Code: ${event.code}, Reason: ${event.reason}`, 'info');
                    
                    if (event.code === 1000) {
                        log('✅ Normal closure', 'success');
                    } else if (event.code === 1006) {
                        log('❌ Abnormal closure - connection lost', 'error');
                    } else {
                        log(`❌ Closure with code: ${event.code}`, 'error');
                    }
                };
                
            } catch (error) {
                log(`❌ Error creating WebSocket: ${error}`, 'error');
            }
        }
        
        // Test both environments on page load
        window.onload = () => {
            log('🚀 WebSocket Connection Test Tool Loaded', 'info');
            log('Click "Test WebSocket Connection" to test the connection', 'info');
        };
    </script>
</body>
</html>
