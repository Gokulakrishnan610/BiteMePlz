version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: rec-kiosk-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_media:/app/media
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: rec-kiosk-frontend
    ports:
      - "80:80"
    restart: always

volumes:
  backend_media:
